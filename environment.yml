name: hyperspatial
channels:
  - conda-forge
  - defaults
dependencies:
  # Python runtime
  - python=3.11
  # Geospatial - ALL from conda-forge so they share the same libarrow binary
  - gdal=3.10
  - pyarrow=19
  - geopandas=1.0
  - shapely>=2.0
  # Big Data
  - pyspark=3.4
  # Utilities
  - numpy>=1.24
  - pandas>=1.5
  - pip
  - pip:
      - apache-sedona[spark]==1.5.1
