name: Build Windows Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: vcpkg install opencl gdal

    - name: Build C++ Engine
      working-directory: hpc-engine
      run: |
        mkdir build
        cd build
        cmake .. -DUSE_OPENCL=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        cmake --build . --config Release

    - name: Package QGIS Plugin
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path qgis-plugin/hyperspatial_bigdata/bin
        Copy-Item hpc-engine/build/Release/hyperspatial_cli.exe -Destination qgis-plugin/hyperspatial_bigdata/bin/
        Compress-Archive -Path qgis-plugin/hyperspatial_bigdata -DestinationPath hyperspatial_bigdata_windows.zip

    - name: Upload Zip File
      uses: actions/upload-artifact@v4
      with:
        name: hyperspatial_bigdata_windows_plugin
        path: hyperspatial_bigdata_windows.zip
