name: Build Windows Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install GDAL + OpenCL (vcpkg, x64)
      run: vcpkg install opencl:x64-windows gdal:x64-windows

    - name: Build C++ engine (OpenCL, Release, x64)
      working-directory: hpc-engine
      run: |
        mkdir build
        cd build
        cmake .. -A x64 -DUSE_OPENCL=ON -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        cmake --build . --config Release

    - name: Bundle engine + GDAL runtime into the processing plugin
      shell: pwsh
      run: |
        $pkg = "qgis-plugin/hyperspatial_processing/hyperspatial_processing"
        $bin = "$pkg/bin/windows"
        New-Item -ItemType Directory -Force -Path $bin | Out-Null
        Copy-Item hpc-engine/build/Release/hyperspatial_cli.exe -Destination $bin/
        # Self-contained: ship the GDAL + OpenCL loader DLLs the engine links, so it
        # runs on a machine with no matching system GDAL. Windows searches the exe's
        # own folder first, so these take precedence over any other GDAL on PATH.
        Copy-Item C:/vcpkg/installed/x64-windows/bin/*.dll -Destination $bin/ -ErrorAction SilentlyContinue
        Write-Host "Bundled into $bin :"
        Get-ChildItem $bin | Select-Object Name, Length | Format-Table -AutoSize

    - name: Package install-ready plugin zip
      shell: pwsh
      run: |
        Compress-Archive -Path qgis-plugin/hyperspatial_processing/hyperspatial_processing -DestinationPath hyperspatial_processing_windows.zip -Force

    - name: Upload plugin zip
      uses: actions/upload-artifact@v4
      with:
        name: hyperspatial_processing_windows_plugin
        path: hyperspatial_processing_windows.zip
