name: Build Plugin (Windows / Linux / macOS)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

# Needed so action-gh-release can create/update the Release and upload assets.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Route vcpkg binary packages through the GitHub Actions cache so GDAL
      # is downloaded (not recompiled from source) on a warm cache.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: Export GitHub Actions cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install GDAL + OpenCL (vcpkg, x64)
        run: vcpkg install opencl:x64-windows gdal:x64-windows
      - name: Build C++ engine (Release, x64)
        working-directory: hpc-engine
        run: |
          mkdir build
          cd build
          cmake .. -A x64 -DUSE_OPENCL=ON -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-windows -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build . --config Release
      - name: Bundle engine + GDAL/OpenCL DLLs (self-contained)
        shell: pwsh
        run: |
          $bin = "qgis-plugin/hyperspatial_processing/hyperspatial_processing/bin/windows"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item hpc-engine/build/Release/hyperspatial_cli.exe -Destination $bin/
          Copy-Item C:/vcpkg/installed/x64-windows/bin/*.dll -Destination $bin/ -ErrorAction SilentlyContinue
      - name: Create engine-only zip (root = contents of bin/windows)
        shell: pwsh
        run: |
          $bin = "qgis-plugin/hyperspatial_processing/hyperspatial_processing/bin/windows"
          Compress-Archive -Path "$bin/*" -DestinationPath engine-windows-x64.zip -Force
      - name: Attach engine zip to Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: engine-windows-x64.zip
      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path qgis-plugin/hyperspatial_processing/hyperspatial_processing -DestinationPath hyperspatial_processing_windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: hyperspatial_processing_windows_plugin
          path: hyperspatial_processing_windows.zip
  macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL + OpenMP + dylibbundler
        run: brew install gdal libomp dylibbundler
      - name: Build C++ engine (Release)
        run: |
          cmake -S hpc-engine -B hpc-engine/build -DUSE_OPENCL=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build hpc-engine/build -j
      - name: Bundle engine + dylibs (self-contained, @loader_path)
        run: |
          set -e
          BIN=qgis-plugin/hyperspatial_processing/hyperspatial_processing/bin/macos
          mkdir -p "$BIN"
          cp hpc-engine/build/hyperspatial_cli "$BIN/"
          # Bundle every non-system dylib NEXT TO the exe so one uniform prefix
          # (@loader_path/) is correct for exe->lib AND lib->lib (a libs/ subdir
          # double-paths inter-lib deps). -cd creates the dir; -s gives Homebrew
          # search paths; </dev/null keeps it non-interactive.
          dylibbundler -cd -of -b -x "$BIN/hyperspatial_cli" -d "$BIN" -p @loader_path/ \
            -s /opt/homebrew/lib -s "$(brew --prefix)/lib" </dev/null
          # Recent dyld rejects dylibs carrying a duplicate LC_RPATH; strip them,
          # then re-sign ad-hoc (arm64 requires a valid signature after editing).
          for f in "$BIN/hyperspatial_cli" "$BIN"/*.dylib; do
            while install_name_tool -delete_rpath '@loader_path/' "$f" 2>/dev/null; do :; done
          done
          codesign --force -s - "$BIN"/*.dylib
          codesign --force -s - "$BIN/hyperspatial_cli"
      - name: Create engine-only zip (root = contents of bin/macos)
        run: |
          cd qgis-plugin/hyperspatial_processing/hyperspatial_processing/bin/macos
          zip -r "$GITHUB_WORKSPACE/engine-macos-arm64.zip" .
      - name: Attach engine zip to Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: engine-macos-arm64.zip
      - name: Package zip (root = plugin package folder)
        run: |
          cd qgis-plugin/hyperspatial_processing
          zip -r "$GITHUB_WORKSPACE/hyperspatial_processing_macos.zip" hyperspatial_processing
      - uses: actions/upload-artifact@v4
        with:
          name: hyperspatial_processing_macos_plugin
          path: hyperspatial_processing_macos.zip

  linux:
    runs-on: ubuntu-22.04   # older glibc = runs on more distros
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL + OpenCL + OpenMP + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgdal-dev libomp-dev opencl-headers ocl-icd-opencl-dev patchelf zip
      - name: Build C++ engine (Release)
        run: |
          cmake -S hpc-engine -B hpc-engine/build -DUSE_OPENCL=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build hpc-engine/build -j
      - name: Bundle engine + .so deps (rpath $ORIGIN/libs; glibc stays system)
        run: |
          BIN=qgis-plugin/hyperspatial_processing/hyperspatial_processing/bin/linux
          mkdir -p "$BIN/libs"
          cp hpc-engine/build/hyperspatial_cli "$BIN/"
          ldd "$BIN/hyperspatial_cli" | awk '/=> \//{print $3}' | while read -r lib; do
            case "$lib" in
              */libc.so*|*/libm.so*|*/libpthread*|*/libdl.so*|*/librt.so*|*/ld-linux*|*/libresolv*) ;;
              *) cp -u "$lib" "$BIN/libs/" ;;
            esac
          done
          patchelf --set-rpath '$ORIGIN/libs' "$BIN/hyperspatial_cli"
          for f in "$BIN"/libs/*.so*; do patchelf --set-rpath '$ORIGIN' "$f" 2>/dev/null || true; done
      - name: Create engine-only zip (root = contents of bin/linux)
        run: |
          cd qgis-plugin/hyperspatial_processing/hyperspatial_processing/bin/linux
          zip -r "$GITHUB_WORKSPACE/engine-linux-x64.zip" .
      - name: Attach engine zip to Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: engine-linux-x64.zip
      - name: Package zip (root = plugin package folder)
        run: |
          cd qgis-plugin/hyperspatial_processing
          zip -r "$GITHUB_WORKSPACE/hyperspatial_processing_linux.zip" hyperspatial_processing
      - uses: actions/upload-artifact@v4
        with:
          name: hyperspatial_processing_linux_plugin
          path: hyperspatial_processing_linux.zip
